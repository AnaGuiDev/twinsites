# Security headers for the twinsites.com server block only.
#
# This file is the single source: `vite preview`, `vite dev` and `npm run qa`
# read it (vite.config.ts), so every PR is tested against the same policy that
# production serves. On the VPS, copy it to /etc/nginx/snippets/ and include it
# in the twinsites `server` block AND in every `location` that has its own
# add_header (nginx drops inherited headers there). Change it here first.
#
# The CSP starts as Report-Only. When a full walk-through of the site shows no
# violation in the console, rename the header to Content-Security-Policy.
# Local preview and QA always enforce it.
#
# If VITE_ANALYTICS_SRC is set for the build, add that script's origin to
# script-src and connect-src.
#
# HSTS starts at one day. Raise to max-age=31536000 after a quiet week.
# Do not add `preload` without Marc's OK: it is close to irreversible.

add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; worker-src 'self'; connect-src 'self' blob: https://twinsites-shot.twinsites.workers.dev; frame-src https://challenges.cloudflare.com; img-src 'self' data: blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
