name = "twinsites-shot"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering (Cloudflare Browser Run). Not used when SHOT_PROVIDER=api.
[browser]
binding = "BROWSER"

# SHOTS also holds the mailing list. Records use the prefix sub:.
# Hourly counters use subip:. They are not a second namespace.
# Unsubscribe links need a secret, created by you:
#   npx wrangler secret put UNSUB_SECRET
# Anonymous trait corrections use the prefix fb: (kept 400 days) and an hourly
# abuse counter fbip: (2 hours). The counter needs a salt, created by you:
#   npx wrangler secret put FEEDBACK_SALT
# Read the corrections with:
#   npx wrangler kv key list --binding SHOTS --prefix fb: --remote
[[kv_namespaces]]
binding = "SHOTS"
id = "c849f0f6f5ca4813967cefa8b19c5600"

[vars]
SHOT_KILL = "0"
SHOT_DAILY_CAP = "40"
SHOT_PROVIDER = "browser"
SERVICES_ENABLED = "0"
SERVICE_OPERATOR_CONFIRMED = "0"
SERVICE_LEGAL_REVIEWED = "0"
SELLER_PUBLICATION_APPROVED = "0"
SERVICE_TAX_CONFIGURED = "0"
SERVICE_WEEKLY_CAPACITY = "2"
SERVICE_PRICE_EUR = "89"
SERVICE_EXTRA_EUR = "29"

# Service orders are optional and stay closed until all credentials are configured.
[[durable_objects.bindings]]
name = "AUDITS"
class_name = "AuditService"

[[migrations]]
tag = "v1-audit-service"
new_sqlite_classes = ["AuditService"]
